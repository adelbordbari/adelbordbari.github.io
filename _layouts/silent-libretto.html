---
layout: default
---
<article class="libretto" data-silent-libretto data-duration="{{ page.duration }}" data-title="{{ page.title | escape }}" aria-busy="true">
  <header class="libretto-header">
    <a class="libretto-header__back" href="{{ '/theater/' | relative_url }}">Theater</a>
    <h1>{{ page.title }}</h1>
    <button class="libretto-button libretto-header__fullscreen" type="button" data-libretto-fullscreen aria-pressed="false">Full screen</button>
  </header>

  <div class="libretto-stage" tabindex="0" aria-label="Timed story. Press Space to play or pause; use the left and right arrow keys to skip five seconds.">
    <span class="libretto-stage__lamp" aria-hidden="true"></span>
    <span class="libretto-stage__light" aria-hidden="true"></span>
    <div class="libretto-stage__content">
      <p class="libretto-stage__cue" data-libretto-cue>The curtain is waiting</p>
      <p class="libretto-stage__line" data-libretto-line aria-live="polite"></p>
      <p class="libretto-stage__intro" data-libretto-intro>Press play. Let the music lead.</p>
    </div>
  </div>

  <div class="libretto-controls" aria-label="Playback controls">
    <audio data-libretto-audio preload="none" data-src="{{ page.audio | relative_url }}"></audio>
    <label class="visually-hidden" for="libretto-progress">Seek through the music</label>
    <input class="libretto-progress" id="libretto-progress" data-libretto-progress type="range" min="0" max="{{ page.duration }}" value="0" step="0.05" aria-valuetext="Loading music" disabled>
    <div class="libretto-controls__row">
      <div class="libretto-controls__buttons">
        <button class="libretto-button libretto-button--primary" type="button" data-libretto-play aria-keyshortcuts="Space" disabled>Loading…</button>
        <button class="libretto-button" type="button" data-libretto-previous disabled>Previous scene</button>
        <button class="libretto-button" type="button" data-libretto-transcript-open>Full story</button>
      </div>
      <p class="libretto-time" aria-live="off"><span data-libretto-current>0:00</span> <span aria-hidden="true">/</span> {{ page.runtime }}</p>
    </div>
    <p class="visually-hidden" data-libretto-status role="status"></p>
  </div>

  <dialog class="libretto-transcript" data-libretto-transcript aria-labelledby="libretto-transcript-title">
    <div class="libretto-transcript__inner">
      <header class="libretto-transcript__header">
        <div>
          <p class="libretto-transcript__kicker">{{ page.title }}</p>
          <h2 id="libretto-transcript-title">The full story</h2>
        </div>
        <button class="libretto-button" type="button" data-libretto-transcript-close>Close <span aria-hidden="true">×</span></button>
      </header>
      <ol class="libretto-transcript__list" data-libretto-transcript-list></ol>
    </div>
  </dialog>

  <script type="application/json" data-libretto-passages>{{ page.passages | jsonify }}</script>
</article>
<script defer src="{{ '/assets/js/silent-libretto.js' | relative_url }}"></script>
